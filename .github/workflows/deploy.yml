name: Deploy to ECS
on:
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
env:
  AWS_REGION: eu-north-1
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: ecs-deploy

      - name: Get ECR registry
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # ---------------- Resolve latest pushed tag per service ----------------
      - name: Get latest API image tag
        id: api-tag
        run: |
          TAG=$(aws ecr describe-images --repository-name ecs2-api --region ${{ env.AWS_REGION }} --query 'sort_by(imageDetails,& imagePushedAt)[-1].imageTags[0]' --output text)
          if [ -z "$TAG" ] || [ "$TAG" = "None" ]; then
            echo "No deployable image tag found in ecs2-api"
            exit 1
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Get latest Dashboard image tag
        id: dashboard-tag
        run: |
          TAG=$(aws ecr describe-images --repository-name ecs2-dashboard --region ${{ env.AWS_REGION }} --query 'sort_by(imageDetails,& imagePushedAt)[-1].imageTags[0]' --output text)
          if [ -z "$TAG" ] || [ "$TAG" = "None" ]; then
            echo "No deployable image tag found in ecs2-dashboard"
            exit 1
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Get latest Worker image tag
        id: worker-tag
        run: |
          TAG=$(aws ecr describe-images --repository-name ecs2-worker --region ${{ env.AWS_REGION }} --query 'sort_by(imageDetails,& imagePushedAt)[-1].imageTags[0]' --output text)
          if [ -z "$TAG" ] || [ "$TAG" = "None" ]; then
            echo "No deployable image tag found in ecs2-worker"
            exit 1
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      # ---------------- API ----------------
      - name: Get current API task definition
        run: |
          aws ecs describe-task-definition --task-definition ecs2-api --query taskDefinition --region ${{ env.AWS_REGION }} > api-task-def.json

      - name: Render new API task definition
        id: render-api
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: api-task-def.json
          container-name: api
          image: ${{ steps.ecr.outputs.registry }}/ecs2-api:${{ steps.api-tag.outputs.tag }}

      - name: Register new API task definition
        id: register-api
        run: |
          ARN=$(aws ecs register-task-definition --cli-input-json file://${{ steps.render-api.outputs.task-definition }} --region ${{ env.AWS_REGION }} --query taskDefinition.taskDefinitionArn --output text)
          echo "arn=$ARN" >> $GITHUB_OUTPUT

      - name: Deploy API via CodeDeploy
        run: |
          aws deploy create-deployment --application-name ecs2-api --deployment-group-name ecs2-api-dg --region ${{ env.AWS_REGION }} --revision '{"revisionType":"AppSpecContent","appSpecContent":{"content":"{\"version\":1,\"Resources\":[{\"TargetService\":{\"Type\":\"AWS::ECS::Service\",\"Properties\":{\"TaskDefinition\":\"'"${{ steps.register-api.outputs.arn }}"'\",\"LoadBalancerInfo\":{\"ContainerName\":\"api\",\"ContainerPort\":8080}}}}]}"}}'

      # ---------------- Dashboard ----------------
      - name: Get current Dashboard task definition
        run: |
          aws ecs describe-task-definition --task-definition ecs2-dashboard --query taskDefinition --region ${{ env.AWS_REGION }} > dashboard-task-def.json

      - name: Render new Dashboard task definition
        id: render-dashboard
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: dashboard-task-def.json
          container-name: dashboard
          image: ${{ steps.ecr.outputs.registry }}/ecs2-dashboard:${{ steps.dashboard-tag.outputs.tag }}

      - name: Register new Dashboard task definition
        id: register-dashboard
        run: |
          ARN=$(aws ecs register-task-definition --cli-input-json file://${{ steps.render-dashboard.outputs.task-definition }} --region ${{ env.AWS_REGION }} --query taskDefinition.taskDefinitionArn --output text)
          echo "arn=$ARN" >> $GITHUB_OUTPUT

      - name: Deploy Dashboard via CodeDeploy
        run: |
          aws deploy create-deployment --application-name ecs2-dashboard --deployment-group-name ecs2-dashboard-dg --region ${{ env.AWS_REGION }} --revision '{"revisionType":"AppSpecContent","appSpecContent":{"content":"{\"version\":1,\"Resources\":[{\"TargetService\":{\"Type\":\"AWS::ECS::Service\",\"Properties\":{\"TaskDefinition\":\"'"${{ steps.register-dashboard.outputs.arn }}"'\",\"LoadBalancerInfo\":{\"ContainerName\":\"dashboard\",\"ContainerPort\":8081}}}}]}"}}'

      # ---------------- Worker ----------------
      - name: Get current Worker task definition
        run: |
          aws ecs describe-task-definition --task-definition ecs2-worker --query taskDefinition --region ${{ env.AWS_REGION }} > worker-task-def.json

      - name: Render new Worker task definition
        id: render-worker
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: worker-task-def.json
          container-name: worker
          image: ${{ steps.ecr.outputs.registry }}/ecs2-worker:${{ steps.worker-tag.outputs.tag }}

      - name: Register new Worker task definition
        id: register-worker
        run: |
          ARN=$(aws ecs register-task-definition --cli-input-json file://${{ steps.render-worker.outputs.task-definition }} --region ${{ env.AWS_REGION }} --query taskDefinition.taskDefinitionArn --output text)
          echo "arn=$ARN" >> $GITHUB_OUTPUT

      - name: Deploy Worker via ECS
        run: |
          aws ecs update-service --cluster ecs2-cluster --service ecs2-worker --task-definition ${{ steps.register-worker.outputs.arn }}