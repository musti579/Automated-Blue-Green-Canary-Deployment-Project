name: Deploy to ECS
on:
  workflow_dispatch:
    inputs:
      api_image_tag:
        description: 'API image tag to deploy (commit SHA)'
        required: true
      dashboard_image_tag:
        description: 'Dashboard image tag to deploy (commit SHA)'
        required: true
      worker_image_tag:
        description: 'Worker image tag to deploy (commit SHA)'
        required: true
permissions:
  id-token: write
  contents: read
env:
  AWS_REGION: eu-north-1
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: ecs-deploy

      - name: Get ECR registry
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # ---------------- API ----------------
      - name: Get current API task definition
        run: |
          aws ecs describe-task-definition --task-definition ecs2-api \
            --query taskDefinition --region ${{ env.AWS_REGION }} > api-task-def.json
      - name: Render new API task definition
        id: render-api
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: api-task-def.json
          container-name: api
          image: ${{ steps.ecr.outputs.registry }}/ecs2-api:${{ github.event.inputs.api_image_tag }}
      - name: Register new API task definition
        id: register-api
        run: |
          ARN=$(aws ecs register-task-definition \
            --cli-input-json file://${{ steps.render-api.outputs.task-definition }} \
            --region ${{ env.AWS_REGION }} --query taskDefinition.taskDefinitionArn --output text)
          echo "arn=$ARN" >> $GITHUB_OUTPUT
      - name: Deploy API via CodeDeploy
        run: |
          aws deploy create-deployment \
            --application-name ecs2-api \
            --deployment-group-name ecs2-api-dg \
            --region ${{ env.AWS_REGION }} \
            --revision '{"revisionType":"AppSpecContent","appSpecContent":{"content":"{\"version\":1,\"Resources\":[{\"TargetService\":{\"Type\":\"AWS::ECS::Service\",\"Properties\":{\"TaskDefinition\":\"'"${{ steps.register-api.outputs.arn }}"'\",\"LoadBalancerInfo\":{\"ContainerName\":\"api\",\"ContainerPort\":8080}}}}]}"}}'

      # ---------------- Dashboard ----------------
      - name: Get current Dashboard task definition
        run: |
          aws ecs describe-task-definition --task-definition ecs2-dashboard \
            --query taskDefinition --region ${{ env.AWS_REGION }} > dashboard-task-def.json
      - name: Render new Dashboard task definition
        id: render-dashboard
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: dashboard-task-def.json
          container-name: dashboard
          image: ${{ steps.ecr.outputs.registry }}/ecs2-dashboard:${{ github.event.inputs.dashboard_image_tag }}
      - name: Register new Dashboard task definition
        id: register-dashboard
        run: |
          ARN=$(aws ecs register-task-definition \
            --cli-input-json file://${{ steps.render-dashboard.outputs.task-definition }} \
            --region ${{ env.AWS_REGION }} --query taskDefinition.taskDefinitionArn --output text)
          echo "arn=$ARN" >> $GITHUB_OUTPUT
      - name: Deploy Dashboard via CodeDeploy
        run: |
          aws deploy create-deployment \
            --application-name ecs2-dashboard \