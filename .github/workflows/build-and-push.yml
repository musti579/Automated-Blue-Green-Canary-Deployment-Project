name: Docker Build and Push
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'services/dashboard/**'
      - 'services/worker/**'
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
  security-events: write
env:
  AWS_REGION: eu-north-1
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Debug OIDC token claims
        run: |
          curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" \
            | jq -r '.value' | cut -d '.' -f2 | base64 -d 2>/dev/null | jq .  

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Install Grype
        run: curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin

      - name: Update vulnerability database
        run: grype db update

      # --- API ---
      - name: Build API image
        run: |
          IMAGE="${{ steps.ecr.outputs.registry }}/ecs2-api"
          docker build -t "$IMAGE:${{ github.sha }}" ./app --platform linux/amd64

      - name: Scan API image
        run: |
          grype "${{ steps.ecr.outputs.registry }}/ecs2-api:${{ github.sha }}" --fail-on critical || true

      - name: Push API image
        run: |
          IMAGE="${{ steps.ecr.outputs.registry }}/ecs2-api"
          docker push "$IMAGE:${{ github.sha }}"

      # --- Dashboard ---
      - name: Build Dashboard image
        run: |
          IMAGE="${{ steps.ecr.outputs.registry }}/ecs2-dashboard"
          docker build -t "$IMAGE:${{ github.sha }}" ./services/dashboard --platform linux/amd64

      - name: Scan Dashboard image
        run: |
          grype "${{ steps.ecr.outputs.registry }}/ecs2-dashboard:${{ github.sha }}" --fail-on critical || true

      - name: Push Dashboard image
        run: |
          IMAGE="${{ steps.ecr.outputs.registry }}/ecs2-dashboard"
          docker push "$IMAGE:${{ github.sha }}"

      # --- Worker ---
      - name: Build Worker image
        run: |
          IMAGE="${{ steps.ecr.outputs.registry }}/ecs2-worker"
          docker build -t "$IMAGE:${{ github.sha }}" ./services/worker --platform linux/amd64

      - name: Scan Worker image
        run: |
          grype "${{ steps.ecr.outputs.registry }}/ecs2-worker:${{ github.sha }}" --fail-on critical || true

      - name: Push Worker image
        run: |
          IMAGE="${{ steps.ecr.outputs.registry }}/ecs2-worker"
          docker push "$IMAGE:${{ github.sha }}"