<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>shrtn — url shortener</title>
<style>
  :root {
    --ink: #12151b;
    --ink-raised: #1a1e26;
    --paper: #ece8de;
    --paper-dim: #8b8d94;
    --cobalt: #4361ff;
    --cobalt-dim: #2c3d99;
    --success: #4ade80;
    --error: #ff6b6b;
    --line: #2a2e38;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--ink);
    color: var(--paper);
    font-family: 'Space Grotesk', -apple-system, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  @font-face {
    font-family: 'Space Grotesk';
    src: local('Space Grotesk');
  }

  .wrap {
    width: 100%;
    max-width: 640px;
  }

  .eyebrow {
    font-family: 'IBM Plex Mono', 'Courier New', monospace;
    font-size: 12px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--cobalt);
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .eyebrow::before {
    content: '';
    width: 6px;
    height: 6px;
    background: var(--cobalt);
    border-radius: 50%;
    display: inline-block;
  }

  h1 {
    font-size: clamp(32px, 6vw, 48px);
    font-weight: 700;
    line-height: 1.05;
    margin: 0 0 12px;
    letter-spacing: -0.02em;
  }

  h1 span {
    color: var(--paper-dim);
    font-weight: 400;
  }

  .sub {
    color: var(--paper-dim);
    font-size: 15px;
    line-height: 1.5;
    margin-bottom: 40px;
    max-width: 46ch;
  }

  .console {
    background: var(--ink-raised);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 20px;
  }

  .row {
    display: flex;
    gap: 8px;
  }

  input[type="url"] {
    flex: 1;
    background: var(--ink);
    border: 1px solid var(--line);
    border-radius: 6px;
    color: var(--paper);
    font-family: 'IBM Plex Mono', 'Courier New', monospace;
    font-size: 14px;
    padding: 13px 14px;
    outline: none;
    transition: border-color 0.15s ease;
    min-width: 0;
  }

  input[type="url"]:focus {
    border-color: var(--cobalt);
  }

  input[type="url"]::placeholder {
    color: #565a66;
  }

  button {
    background: var(--cobalt);
    color: var(--paper);
    border: none;
    border-radius: 6px;
    padding: 13px 20px;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.1s ease;
    white-space: nowrap;
  }

  button:hover:not(:disabled) { background: #5470ff; }
  button:active:not(:disabled) { transform: scale(0.98); }
  button:disabled { background: var(--cobalt-dim); cursor: default; opacity: 0.6; }

  .result {
    margin-top: 18px;
    display: none;
  }

  .result.show { display: block; }

  .wire {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 0;
  }

  .wire svg { flex-shrink: 0; }

  .short-tag {
    font-family: 'IBM Plex Mono', 'Courier New', monospace;
    font-size: 15px;
    background: var(--ink);
    border: 1px solid var(--cobalt-dim);
    color: var(--success);
    padding: 10px 14px;
    border-radius: 6px;
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .copy-btn {
    background: transparent;
    border: 1px solid var(--line);
    color: var(--paper-dim);
    padding: 10px 14px;
    font-size: 13px;
  }

  .copy-btn:hover:not(:disabled) { background: var(--line); color: var(--paper); }

  .error-msg {
    margin-top: 14px;
    font-family: 'IBM Plex Mono', 'Courier New', monospace;
    font-size: 13px;
    color: var(--error);
    display: none;
  }

  .error-msg.show { display: block; }

  .settings {
    margin-top: 28px;
    padding-top: 20px;
    border-top: 1px solid var(--line);
  }

  .settings summary {
    font-family: 'IBM Plex Mono', 'Courier New', monospace;
    font-size: 12px;
    color: var(--paper-dim);
    cursor: pointer;
    letter-spacing: 0.04em;
  }

  .settings summary:hover { color: var(--paper); }

  .settings-body {
    margin-top: 12px;
    display: flex;
    gap: 8px;
  }

  .settings-body input {
    flex: 1;
    background: var(--ink);
    border: 1px solid var(--line);
    border-radius: 6px;
    color: var(--paper-dim);
    font-family: 'IBM Plex Mono', 'Courier New', monospace;
    font-size: 12px;
    padding: 9px 10px;
    outline: none;
  }

  .settings-body input:focus { border-color: var(--cobalt); color: var(--paper); }

  .settings-body button {
    padding: 9px 14px;
    font-size: 12px;
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="eyebrow">ecs2 · live</div>
  <h1>Make it <span>shorter.</span></h1>
  <p class="sub">Paste a long URL. Get a short one back</p>

  <div class="console">
    <div class="row">
      <input type="url" id="urlInput" placeholder="https://example.com/a/very/long/path/you/dont/want/to/type" autocomplete="off" />
      <button id="shortenBtn">Shorten</button>
    </div>

    <div class="result" id="result">
      <div class="wire">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
          <path d="M2 10 H18" stroke="#4ade80" stroke-width="1.5" stroke-dasharray="2 3"/>
          <path d="M14 6 L18 10 L14 14" stroke="#4ade80" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="short-tag" id="shortTag"></span>
        <button class="copy-btn" id="copyBtn">Copy</button>
      </div>
    </div>

    <div class="error-msg" id="errorMsg"></div>

    <details class="settings">
      <summary>API endpoint</summary>
      <div class="settings-body">
        <input type="text" id="apiBase" placeholder="http://your-alb-dns-name.elb.amazonaws.com" />
      </div>
    </details>
  </div>
</div>

<script>
  const DEFAULT_API = 'http://ecs2-alb-228995125.eu-north-1.elb.amazonaws.com';

  const urlInput = document.getElementById('urlInput');
  const shortenBtn = document.getElementById('shortenBtn');
  const result = document.getElementById('result');
  const shortTag = document.getElementById('shortTag');
  const copyBtn = document.getElementById('copyBtn');
  const errorMsg = document.getElementById('errorMsg');
  const apiBase = document.getElementById('apiBase');

  apiBase.value = DEFAULT_API;

  function showError(msg) {
    errorMsg.textContent = msg;
    errorMsg.classList.add('show');
    result.classList.remove('show');
  }

  function clearError() {
    errorMsg.classList.remove('show');
  }

  async function shorten() {
    const longUrl = urlInput.value.trim();
    if (!longUrl) {
      showError('Paste a URL first.');
      return;
    }
    try {
      new URL(longUrl);
    } catch {
      showError('That doesn\'t look like a valid URL — include the http:// or https://');
      return;
    }

    const base = apiBase.value.trim().replace(/\/$/, '');
    if (!base) {
      showError('Set the API endpoint below first.');
      return;
    }

    clearError();
    shortenBtn.disabled = true;
    shortenBtn.textContent = 'Shortening…';

    try {
      const res = await fetch(`${base}/shorten`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ url: longUrl })
      });

      if (!res.ok) {
        throw new Error(`Server responded ${res.status}`);
      }

      const data = await res.json();
      const code = data.short || data.short_code || data.code;
      if (!code) throw new Error('Response had no short code');

      const fullShort = `${base}/${code}`;
      shortTag.textContent = fullShort;
      result.classList.add('show');
    } catch (err) {
      showError(`Couldn't reach the shortener — ${err.message}. Check the API endpoint is correct and the ALB is running.`);
    } finally {
      shortenBtn.disabled = false;
      shortenBtn.textContent = 'Shorten';
    }
  }

  shortenBtn.addEventListener('click', shorten);
  urlInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') shorten();
  });

  copyBtn.addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(shortTag.textContent);
      copyBtn.textContent = 'Copied';
      setTimeout(() => { copyBtn.textContent = 'Copy'; }, 1500);
    } catch {
      copyBtn.textContent = 'Select & copy';
    }
  });
</script>

</body>
</html>
